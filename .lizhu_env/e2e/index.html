<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>plugin-market UI · 离朱 E2E</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      /* The settings shell replica: a chrome row on top and a bounded content
         box below. The market page must fill the box, never the document. */
      #shell {
        height: 100vh;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      #shell-header {
        flex: none;
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid #d0d0d0;
      }
      #host {
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box;
        padding: 16px;
        overflow: hidden;
        border: 2px solid #444;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="shell-header">settings shell</div>
      <div id="host"></div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
