# dsh-plugin-market bundle patch: the default activation layer applied when the
# package is installed into a profile through `dsh plugin add` (the package
# declares dsh.bundle.patch -> ./cordis.patch.yml).
#
# Single-row convergence: the package activates through exactly ONE loader row.
# - plugin-market-host (package main, lib/index.js from src/index.ts) is the
#   package composer: it normalizes Config (optional repositoryPath), opens the
#   plugin source repository and provides it as the `marketRepository` Cordis
#   service, then activates the market control (record-driven controller +
#   Remote/web gateway) in the SAME context via ctx.plugin. The control is NOT
#   a standalone row: it inherits this row's lifecycle and loader chain.
# - The browser half (settings tab, lib/client.js) is delivered through the
#   package's dsh.client declaration (./client export) and needs no row.
#   The composable control module stays reachable as the ./control export for
#   hosts that want to embed it directly, but nothing mounts it as a row.
#
# Row ids are stable and never carry the loader-forbidden colon. A source/dev
# profile appends the same single row as a relative file row instead; see
# scripts/install-profile.mjs and README "Profile self-load".
- insert:
    - id: plugin-market-host
      name: dsh-plugin-market